<style>

.seal{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:5;color:var(--gold);font-size:28px;transition:opacity .4s}.env.open .seal{opacity:0}

#cf{position:fixed;inset:0;pointer-events:none;z-index:70}
.fin{text-align:center;min-height:70vh;display:grid;place-content:center;gap:10px}

button,a,.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(min-width:700px){#mb{display:none}#links{display:flex;position:static;flex-direction:row;background:none;border:0;padding:0}#links a{padding:10px 12px;font-size:15px}}

@media(hover:none){.gi:hover{transform:none}.btn:hover{transform:none;box-shadow:none}}

</style></head><body>

<script>
/* ===== EDIT ME: all personal content lives here ===== */
const CFG={
 formKey:"02472a7a-58ed-4152-a6a4-2e808253b530", // free key from web3forms.com, wishes arrive in YOUR email only
 name:"My Favorite Person", from:"Me", date:"25th OCT",
 hero:"Happy Birthday,", sub:"From your BOKA",

 // optional per-photo text, keyed by the photo number. cat is used for the filter buttons on the Memories page (leave cat out to hide the filters)
 meta:{1:{cap:"US",date:"",cat:"Us"},2:{cap:"WE",date:"",cat:"Adventures"}},

 timeline:[
  ["The day we met","SAMPLE DATE","SAMPLE: write the story of how it began.","Add a longer memory here."],
  ["Our first photograph together","","SAMPLE: describe it.","Extra detail or a second memory."],
  ["An ordinary, beautiful day","","SAMPLE: the little moment that became everything.","More here."],
  ["An inside joke","","SAMPLE: the one that still makes us laugh.","The full story."]],
 letter:["To my Dumbpling,","I don't really know how to put everything into words, but I'm genuinely glad that u came into my life. There's something about u that makes even the most ordinary moments feel a little more special. I don't know if u realise it, but u have a way of making me smile without even trying.I hope this year brings u all the happiness u deserve, and I hope u never lose the little things that make u . U deserve so many good things in life, and I really hope u get them.And well, I just wanted u to know that u're more special to me than I probably show. I might not always say it, but I hope u feel it in the little things.Have the happiest birthday. U deserve the world, and a little more"],
 reasons:[["A little thing you do","POOP"],["A memory that makes me smile","Each and every time spend with u"],["Something I admire","Apki Opinions"],["A moment you made my day","When u just look at me"],["Why I'm grateful","Iss bechare ko sahara dene ke liye"],["Just because"," I only need you <3"]],
 song:{src:"song/our-song.mp3",title:"Our Song",artist:"Artist name",note:"SAMPLE: why this song is ours.",link:""},
 finale:["Happy Birthday.","Thank you for every ordinary day that turned into a favorite one.","Find secert msg 👀(hint: twinkle twinkle.....)"],
 secret:[
  `To my dumb asteroid,`,
  `Haha, akhir apne dhundh he liya, Just want to say i m very clear about you, want to see u aside me in future.`,
  `Trying to put all the effort i can do to endlessly be with u but mai lenient ho jata.Be with me and correct me where i am wrong and help me to be in track.`,

};
/* ===== core ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const routes=[["","Home"],["orbit","Orbit"],["memories","Memories"],["letter","Letter"],["reasons","Reasons"],["wish","Wish"],["finale","Finale"]];
$("#links").innerHTML=routes.map(r=>`<a href="#/${r[0]}" data-r="${r[0]}">${r[1]}</a>`).join("");

let user=[],cleanup=[],found=[];
/* auto-discover photos: photos/photo1.ext, photo2.ext ... stops at the first missing number */
async function discover(){const dir=CFG.photoDir||"photos/";let E=["jpg","jpeg","png","webp","JPG","JPEG","PNG","WEBP"];
 const tryN=n=>new Promise(res=>{let i=0;const nx=()=>{if(i>=E.length)return res(null);const ext=E[i++],src=`${dir}photo${n}.${ext}`,im=new Image();im.onload=()=>res({src,ext,h:im.naturalHeight,w:im.naturalWidth});im.onerror=nx;im.src=src};nx()});
 for(let n=1;n<=200;n++){const r=await tryN(n);if(!r)break;E=[r.ext,...E.filter(x=>x!=r.ext)];const m=(CFG.meta||{})[n]||{};found.push({src:r.src,cap:m.cap||"",date:m.date||"",cat:m.cat||"",ratio:r.h/r.w,n})}}

/* starfield */
(()=>{const c=$("#stars"),x=c.getContext("2d");let w,h,S=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;S=Array.from({length:Math.min(90,w/12)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+.3,p:Math.random()*6,v:Math.random()*.15+.03}))};rs();addEventListener("resize",rs);
(function f(t){x.clearRect(0,0,w,h);S.forEach(s=>{if(!RM){s.y-=s.v;if(s.y<0)s.y=h}x.globalAlpha=.3+.5*Math.abs(Math.sin(t/1200+s.p));x.fillStyle="#f4ead9";x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});requestAnimationFrame(f)})(0)})();

function conf(){if(RM)return;const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const col=["#d9a3a8","#e0b783","#f4ead9","#7a2438","#ffcf6b"];const P=Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:Math.random()*8+4,c:col[Math.random()*5|0],r:Math.random()*6}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(0,0,p.s,p.s*.6);x.restore()});if(++n<170)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

let L=[],li=0,lastF;

function openSecretNote(){

function closeSecretNote(){

}
const step=d=>{li=(li+d+L.length)%L.length;show()};
$("#lx").onclick=lclose;$("#lp").onclick=()=>step(-1);$("#ln").onclick=()=>step(1);$("#lb").onclick=e=>{if(e.target.id=="lb")lclose()};
addEventListener("keydown",e=>{if(!$("#lb").classList.contains("on"))return;if(e.key=="Escape")lclose();if(e.key=="ArrowRight")step(1);if(e.key=="ArrowLeft")step(-1);if(e.key=="Tab"){const f=$$("#lb button");const i=f.indexOf(document.activeElement);e.preventDefault();f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus()}});
let tx=0;$("#lb").addEventListener("touchstart",e=>tx=e.touches[0].clientX);$("#lb").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)step(d<0?1:-1)});

  $("#op").onclick=()=>{startSong();$(".env").classList.add("open");setTimeout(go,1700)};$("#sk").onclick=()=>{startSong();go()};$("#op").focus()}},
orbit:v=>{v.innerHTML=`<h2>Memory <em>Orbit</em></h2><p class="sub">Our photos, circling forever. Drag to spin, tap the front photo to open it.</p><div class="stage" id="st"><div class="ring" id="rg"></div></div><div class="cap" id="cp"></div><div class="ctl"><button class="btn g" id="pv" aria-label="Previous">‹</button><button class="btn g" id="pp">Pause</button><button class="btn g" id="nx" aria-label="Next">›</button></div><div class="ctl" id="ad"></div>`+nextLink("memories","Memories");
 let ang=0,play=!RM,hover=false,drag=false,sx=0,N,st,cards,raf;const build=()=>{let a=pics();const L2=[];while(L2.length<8)L2.push(...a);N=L2.length;const cw=innerWidth<600?130:innerWidth<1100?250:190;$("#rg").style.setProperty("--cw",cw+"px");const R=cw/2/Math.tan(Math.PI/N)+30;st=360/N;

 const upd=()=>{$("#rg").style.transform=`translateZ(-1px) rotateY(${ang}deg)`;let best=0,bd=999;cards.forEach((c,i)=>{let d=((i*st+ang)%360+540)%360-180;const o=.3+.7*Math.max(0,Math.cos(d*Math.PI/180));c.style.opacity=o;c.style.filter=`blur(${(1-o)*3}px)`;c.dataset.f=Math.abs(d)<st/2?1:0;if(Math.abs(d)<bd){bd=Math.abs(d);best=i}});const a=pics(),p=a[+cards[best].dataset.i];$("#cp").innerHTML=`<div class="hw">${p.cap||""}</div><small style="color:var(--mut)">${p.date||""}</small>`};
 const tick=()=>{if(play&&!hover&&!drag)ang-=.18;upd();raf=requestAnimationFrame(tick)};tick();cleanup.push(()=>cancelAnimationFrame(raf));
 st=st;const s=$("#st");s.onmouseenter=()=>hover=true;s.onmouseleave=()=>hover=false;s.onfocusin=()=>hover=true;s.onfocusout=()=>hover=false;
 s.onpointerdown=e=>{drag=true;sx=e.clientX};addEventListener("pointerup",()=>drag=false);s.onpointermove=e=>{if(drag){ang+=(e.clientX-sx)*.4;sx=e.clientX}};
 const stp=360/N;$("#pv").onclick=()=>ang+=stp;$("#nx").onclick=()=>ang-=stp;$("#pp").onclick=()=>{play=!play;$("#pp").textContent=play?"Pause":"Play"};$("#pp").textContent=play?"Pause":"Play";
 const kd=e=>{if(e.key=="ArrowLeft")ang+=stp;if(e.key=="ArrowRight")ang-=stp};addEventListener("keydown",kd);cleanup.push(()=>removeEventListener("keydown",kd));
 },

 v.innerHTML=`<h2>Our <em>memories</em></h2><p class="sub">A scrapbook of the little moments.</p>${(()=>{const u=[...new Set(pics().map(p=>p.cat).filter(Boolean))];return u.length?`<div class="chips">${["All",...u].map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join("")}</div>`:""})()}<div class="grid" id="g"></div><div id="ad"></div>`+nextLink("letter","The letter");
 $$(".chip",v).forEach(c=>c.onclick=()=>{cat=c.dataset.c;draw()});draw()},

 $$(".fc",v).forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",b.classList.toggle("f")))},
